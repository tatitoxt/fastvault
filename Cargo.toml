[workspace]
resolver = "2"
members = [
    "crates/fastvault-core",
    "crates/fastvault-crypto",
    "crates/fastvault-store",
    "crates/fastvault-audit",
    "crates/fastvault-agent",
    "crates/fastvault-sync",
    "crates/fastvault-tui",
    "crates/fastvault-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Fausto Pastura <fausto@example.com>"]
repository = "https://github.com/tatitoxt/fastvault"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["secrets", "security", "vault", "cli", "encryption"]
categories = ["command-line-utilities", "cryptography", "config"]

[workspace.dependencies]
# Internal workspace crates
fastvault-core = { path = "crates/fastvault-core" }
fastvault-crypto = { path = "crates/fastvault-crypto" }
fastvault-store = { path = "crates/fastvault-store" }
fastvault-audit = { path = "crates/fastvault-audit" }
fastvault-agent = { path = "crates/fastvault-agent" }
fastvault-sync = { path = "crates/fastvault-sync" }
fastvault-tui = { path = "crates/fastvault-tui" }

# Cryptography & Security
argon2 = { version = "0.5", features = ["std", "zeroize"] }
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive", "alloc", "std"] }
secrecy = { version = "0.8", features = ["serde"] }
rand = "0.8"
getrandom = "0.2"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
totp-lite = "2.0"
hex = "0.4"

# Serialization & Data Formats
serde = { version = "1.0", features = ["derive", "alloc"] }
serde_json = "1.0"
bincode = "1.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# CLI & Terminal
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
comfy-table = "7.1"
colored = "3.1"
dialoguer = "0.11"
arboard = "3.4"
ratatui = "0.28"
crossterm = "0.28"

# Async & Concurrency
tokio = { version = "1.39", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"

# System & OS
fd-lock = "4.0"
tempfile = "3.12"
dirs = "5.0"
libc = "0.2"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"

# Testing & Benchmarking
proptest = "1.5"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
